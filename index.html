<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ebook tự học 4 tuần cho Quang Hải</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: sidebar of weeks on the left, one lesson page at a time on the right; stacks to a top strip on phones. */
:root{
  --bg:#F4F7F6; --surface:#FFFFFF; --ink:#14201F; --muted:#52625F; --line:#D5DFDC;
  --accent:#0E6B73; --accent-ink:#FFFFFF; --accent-soft:#DFF0F0;
  --speak:#4B3FA8; --speak-soft:#ECEAFB;
  --good:#17703F; --good-soft:#DFF3E7; --bad:#B3261E; --bad-soft:#FBE5E3; --warn-soft:#FFF2D6; --warn:#7A4F00;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1514; --surface:#152120; --ink:#E5EEEC; --muted:#9BAFAB; --line:#294240;
    --accent:#52C4CD; --accent-ink:#06201F; --accent-soft:#12302F;
    --speak:#ADA4F7; --speak-soft:#211E45;
    --good:#62D494; --good-soft:#12301F; --bad:#FF8E85; --bad-soft:#3A1816; --warn-soft:#33270B; --warn:#F0C36B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1514; --surface:#152120; --ink:#E5EEEC; --muted:#9BAFAB; --line:#294240;
  --accent:#52C4CD; --accent-ink:#06201F; --accent-soft:#12302F;
  --speak:#ADA4F7; --speak-soft:#211E45;
  --good:#62D494; --good-soft:#12301F; --bad:#FF8E85; --bad-soft:#3A1816; --warn-soft:#33270B; --warn:#F0C36B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px}
.shell{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;align-items:start}
nav.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:6px}
.brand{font:700 20px/1.2 var(--font-display);margin:0 0 10px}
.brand small{display:block;font:600 12px var(--font-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
nav.side a{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;border:1px solid transparent}
nav.side a:hover{background:var(--accent-soft)}
nav.side a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav.side a b{font-weight:700}
nav.side a span{font-size:13px;opacity:.85;font-variant-numeric:tabular-nums}
nav.side a small{grid-column:1/-1;font-size:12.5px;opacity:.8;line-height:1.3}
.bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
nav.side a[aria-current="page"] .bar{background:rgba(255,255,255,.35)}
main{min-width:0}
h1,h2,h3{font-family:var(--font-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4.5vw,40px);letter-spacing:-.01em}
h2{font-size:24px;margin-bottom:12px}
h3{font-size:18px;margin-bottom:10px}
.eyebrow{font:700 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.lede{font-size:18px;color:var(--muted);max-width:62ch;margin:10px 0 0}
.hero{padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px}
.goals{margin:16px 0 0;padding-left:20px}
.goals li{margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip.s{background:var(--speak-soft);color:var(--speak)}
.chip.w{background:var(--warn-soft);color:var(--warn)}
details.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:14px 0}
details.day>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
details.day>summary::-webkit-details-marker{display:none}
details.day>summary .dn{font:700 13px var(--font-body);color:var(--accent);letter-spacing:.06em;text-transform:uppercase;min-width:54px}
details.day>summary .dt{font:700 18px var(--font-display);flex:1 1 220px}
details.day>summary .dm{font-size:13px;color:var(--muted)}
details.day>summary .ok{display:none;font-size:13px;font-weight:700;color:var(--good)}
details.day.done>summary .ok{display:inline}
details.day[open]>summary{border-bottom:1px solid var(--line)}
.daybody{padding:6px 18px 18px}
.block{margin:18px 0;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.block.note{background:var(--accent-soft);border-color:transparent}
.block.speak{background:var(--speak-soft);border-color:transparent}
.block h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.block .intro{margin:0 0 10px;color:var(--muted)}
.block p{margin:8px 0}
.block ul,.block ol{margin:8px 0;padding-left:22px}
.block li{margin:5px 0}
.tablewrap{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:15px}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--surface);font-weight:700}
.block.vocab .en{font-weight:700}
.hide-vi .vi{color:transparent;background:var(--line);border-radius:4px;user-select:none}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:0 0 8px}
.eg{color:var(--muted);font-size:14.5px}
.ex ol{list-style:decimal;padding-left:26px}
.ex li{padding:6px 0}
input.gap{font:inherit;width:9.5em;max-width:100%;padding:3px 8px;margin:0 3px;border:none;border-bottom:2px solid var(--accent);background:var(--surface);color:var(--ink);border-radius:4px 4px 0 0}
input.gap:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input.gap.ok{border-bottom-color:var(--good);background:var(--good-soft)}
input.gap.bad{border-bottom-color:var(--bad);background:var(--bad-soft)}
.fb{display:block;font-size:14px;margin-top:2px}
.fb.bad{color:var(--bad)}
.fb.ok{color:var(--good)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.btn{font:700 14px var(--font-body);padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:3px 10px;font-size:13px}
.btn.rec{background:var(--speak);border-color:var(--speak);color:#fff}
.btn.rec.on{background:var(--bad);border-color:var(--bad)}
.btn:focus-visible,summary:focus-visible,a:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.score{font-weight:700}
.score.pass{color:var(--good)}
.score.fail{color:var(--bad)}
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:none}
.q p{margin:0 0 6px;font-weight:600}
.opt{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:6px;cursor:pointer}
.opt:hover{background:var(--accent-soft)}
.opt.right{background:var(--good-soft);color:var(--good);font-weight:700}
.opt.wrong{background:var(--bad-soft);color:var(--bad)}
.opt input{margin-top:6px}
.rec-wrap{margin-top:12px;padding:12px;border-radius:8px;background:var(--surface);border:1px dashed var(--speak)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;margin-left:10px}
.take{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.take audio{max-width:100%;height:36px}
.rec-note{font-size:13.5px;color:var(--muted);margin:8px 0 0}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.model{margin-top:8px}
.model summary{cursor:pointer;font-weight:700;color:var(--speak)}
.model div{white-space:pre-line;margin-top:6px;padding:10px 12px;background:var(--surface);border-radius:8px}
.donebar{display:flex;gap:10px;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-weight:700}
.callout{border-left:4px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:14px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h3{font-size:16px}
.card p{margin:4px 0;font-size:15px}
.tag-pass{color:var(--good);font-weight:700}
.tag-fail{color:var(--bad);font-weight:700}
.tag-mid{color:var(--accent);font-weight:700}
.tag-mute{color:var(--muted);font-weight:700}
.line{margin:6px 0}
.muted{color:var(--muted)}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font:700 28px var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:13.5px;color:var(--muted)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.wcard header{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.wcard h3{font-size:16px;margin:0;flex:1 1 180px}
.status{font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.dots{display:flex;align-items:center;gap:6px;margin:6px 0 8px}
.dots span{font-size:13.5px;color:var(--muted);margin-left:6px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:transparent;display:inline-block}
.dot.on{background:var(--good);border-color:var(--good)}
.dot.late{background:var(--warn);border-color:var(--warn)}
details.day.locked>summary{cursor:not-allowed;opacity:.65}
details.day>summary .lk{display:none;font-size:13px;font-weight:700;color:var(--muted)}
details.day.locked>summary .lk{display:inline}
.latetag{font-size:13px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:2px 10px}
.donehint{font-size:14px;color:var(--muted);margin:6px 0 0}
.why{margin:6px 0;padding-left:20px;color:var(--bad);font-size:14.5px}
.warnline{margin:6px 0;color:var(--warn);font-size:14.5px;font-weight:700}
.notel{font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px;display:block}
.notetext{margin:0;font-size:15px}
.saved{font-size:13px;color:var(--muted)}
.wcard textarea,.cfg input[type=date]{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.cfg{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.cfg input[type=date]{width:auto}
.dmy{display:flex;gap:8px;margin:6px 0 12px}
.dmy select{font:inherit;font-size:16px;padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);flex:1;min-width:0}
.cfg .dmy{margin:0}
.dmy-err{color:var(--bad);margin:0 0 8px;min-height:1.2em}
.btn.is-sent{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn:disabled,input:disabled{opacity:.55;cursor:not-allowed}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px}
  nav.side{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:8px}
  nav.side .brand{display:none}
  nav.side a{min-width:104px;flex:0 0 auto}
  nav.side a small{display:none}
}
/* login gate, start-date dialog, toast */
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.gate[hidden]{display:none}
.shell[hidden]{display:none}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:400px}
.gate-card h1,.gate-card h2{font-family:var(--font-display);margin:4px 0 8px;line-height:1.2}
.gate-card h1{font-size:28px}.gate-card h2{font-size:22px}
.gate-card .eyebrow{font:700 12px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.gate-card input{font:inherit;font-size:18px;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin:6px 0 12px}
.gate-card .btn{width:100%;padding:12px;font-size:16px}
.gate-card .msg{min-height:1.4em;color:var(--bad);margin:10px 0 0}
.gate-card .hint{color:var(--muted);font-size:14px;margin:12px 0 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast[hidden]{display:none}
.sched{background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin:0 0 14px}
.sched a{color:var(--accent)}
nav.side .logout{margin-top:10px;font:600 13px var(--font-body);background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;white-space:nowrap}
/* lịch sử lượt làm bài */
.runs{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.runs:empty{display:none}
.runs>b{font-size:14px;color:var(--muted)}
details.run{border:1px solid var(--line);border-radius:8px;margin:6px 0;background:var(--surface)}
details.run>summary{cursor:pointer;padding:7px 10px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:14.5px}
details.run>summary .rn{font-weight:700;min-width:52px}
details.run>summary .rt{color:var(--muted);font-variant-numeric:tabular-nums}
details.run>summary .rx{font-weight:700;flex:1 1 200px}
details.run .rd{padding:4px 10px 10px}
details.run .rd table{min-width:0;font-size:14px}
details.run .rd td.ok{color:var(--good);font-weight:700}
details.run .rd td.bad{color:var(--bad);font-weight:700}
.rday{margin:16px 0 4px;font:700 15px var(--font-display)}
.runfilter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.runfilter select{font:inherit;font-size:15px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gate-form" autocomplete="off">
    <div class="eyebrow">Ebook tự học · A1 Empower</div>
    <h1>Bùi Quang Hải · 4 tuần</h1>
    <p>Nhập mã của bạn để vào học hoặc xem tiến độ.</p>
    <label for="gate-code"><b>Mã đăng nhập</b></label>
    <input id="gate-code" type="text" autocapitalize="off" spellcheck="false" placeholder="Nhập mã của bạn">
    <button class="btn" type="submit">Vào</button>
    <p class="msg" id="gate-msg" role="alert"></p>
    <p class="hint">Hải, phụ huynh và giáo viên mỗi người có một mã riêng. Chưa có mã thì hỏi giáo viên.</p>
  </form>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="shell">
  <nav class="side" id="side" aria-label="Mục lục"></nav>
  <main id="main"></main>
</div>
<script>
"use strict";
/* ===== Cấu hình riêng cho từng học viên (build_ebook.py điền vào) ===== */
const CFG={
  student:"Hải",      // tên gọi ngắn trong câu: "Hưng"
  full:"Bùi Quang Hải",          // tên đầy đủ: "Tuấn Hưng"
  side:"Quang Hải · A1",          // dòng tên ở thanh bên: "Tuấn Hưng · A1"
  store:"qh4",         // tiền tố localStorage, KHÔNG trùng giữa các ebook cùng tên miền
  file:"quang-hai",           // tiền tố tên file ghi âm: "tuan-hung"
  pass:0.8,                    // mức đạt bài kiểm tra (0.8 = 80%)
  speakRatio:0.6,       // tỉ lệ bài nói cần gửi để đạt tuần
  allowMiss:1,         // số ngày được phép bỏ trong một tuần mà vẫn đạt
  tests:{"mockA": ["Đề thi thử A", "Đề A"], "mockB": ["Đề thi thử B", "Đề B"]},             // tên hiển thị các bài kiểm tra không theo mẫu "wN": {"mockA":["Đề thi thử A","Đề A"]}
  finals:["mockA", "mockB"],           // các bài thi cuối khoá, hiện ở ô tổng kết của Sổ điểm
  daily:true,                  // true = mỗi ngày theo lịch chỉ học xong 1 bài, bài sau mở vào hôm sau
  low:0.5                       // lần Kiểm tra đầu dưới mức này (0.5 = 50%) hoặc có câu bỏ trống thì ghi chú khi tick xong ngày
};
const PCT=Math.round(CFG.pass*100);
/* tên bài kiểm tra: dạng dài ("Bài kiểm tra tuần 1") hoặc ngắn ("Kiểm tra") */
function testName(id,short){
  if(CFG.tests[id])return CFG.tests[id][short?1:0];
  const m=/^w(\d+)$/.exec(id);
  return m?(short?"Kiểm tra":"Bài kiểm tra tuần "+m[1]):id;
}
const WEEKS=[];
let INTRO="";
const N=(h,html)=>({t:"note",h,html});
const V=(h,rows,intro)=>({t:"vocab",h,rows,intro});
const F=(h,intro,items)=>({t:"fill",h,intro,items});
const M=(h,intro,items,test)=>({t:"mcq",h,intro,items,test});
const S=(h,prompt,steps,model,checks)=>({t:"speak",h,prompt,steps,model,checks});
const D=(title,min,blocks)=>({title,min,blocks});
INTRO=`
<div class="hero">
  <div class="eyebrow">Ebook tự học · Bùi Quang Hải · A1 Empower</div>
  <h1>4 tuần sửa đúng những lỗi Hải hay sai</h1>
  <div class="chips"><span class="chip">4 tuần</span><span class="chip">5 ngày học + 1 ngày kiểm tra mỗi tuần</span><span class="chip">35–45 phút mỗi ngày</span><span class="chip s">Ghi âm ngay trong trang</span></div>
</div>

<p><b>Ebook này làm riêng cho Hải.</b> Mọi bài tập đều xây quanh những câu em đã làm sai trong các bài quiz và Progress Test từ Unit 5 đến Unit 10: <i>was/were</i>, <i>didn't + động từ</i>, <i>am/is/are + V-ing</i>, giới từ <i>in/on/at</i> và các nhóm từ vựng hay viết sai.</p>
<p><b>Mục tiêu:</b> đạt từ 80% trở lên (12/15 câu, 24/30 câu) ở bài kiểm tra mỗi tuần và ở 2 đề thi thử tuần 4.</p>

<h2 style="margin-top:28px">Cách học mỗi ngày</h2>
<p>Mở ngày cần học và làm lần lượt từ trên xuống:</p>
<ol>
  <li><b>Học:</b> đọc khung <b>Ghi nhớ</b>, hoặc <b>Bảng từ</b> ở ngày học từ vựng. Bấm "Nghe" để nghe cách đọc, rồi bật "Che nghĩa" để tự kiểm tra.</li>
  <li><b>Làm bài:</b> làm bài điền từ và chọn đáp án, bấm "Kiểm tra". Câu sai thì đọc đáp án, hiểu vì sao, rồi bấm "Làm lại".</li>

function say(text){
  try{

    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=0.85;

    u.onerror=e=>{if(e.error!=="interrupted"&&e.error!=="canceled")ttsFail()};

  }catch(e){ttsFail()}
}

async function api(body){
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});

  const [col,id]=it.path.split("/");
  if(col==="attempts"){STATE.attempts=STATE.attempts.filter(a=>a.id!==id);STATE.attempts.push(it.data)}

      let r;
      try{r=await api({action:"set",code:CTX.code,items:batch})}catch(e){return false}
      if(!r.ok){if(r.error==="code")logout("Mã đăng nhập đã thay đổi. Hãy nhập mã mới.");return false}
      const sent=new Set(batch.map(x=>x.path+"|"+JSON.stringify(x.data)));
      Q.set(Q.get().filter(x=>!sent.has(x.path+"|"+JSON.stringify(x.data))));
    }
  })();
  const ok=await flushing;flushing=null;
  if(CTX.online){
    if(!ok&&CTX.status!=="loading")CTX.status="offline";
    else if(ok&&CTX.status==="offline")CTX.status="ok";
    const b=$("#banner");if(b)b.innerHTML=bannerHTML();
  }
  return ok;
}
function dbSet(path,data){
  if(!CTX.online)return Promise.resolve(false);
  const q=Q.get().filter(x=>x.path!==path);q.push({path,data});Q.set(q);
  saveCache();
  return flush();
}
const isDone=(n,i)=>!!(STATE.days[dayId(n,i)]&&STATE.days[dayId(n,i)].done);
/* học theo thứ tự: một ngày chỉ mở khi mọi ngày trước đó (kể cả tuần trước) đã xong */
const seqOf=(n,i)=>{const w=WEEKS.findIndex(x=>x.n===n);return WEEKS.slice(0,w).reduce((t,x)=>t+x.days.length,0)+i-1};
const localDay=d=>{const x=new Date(d);return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate()};
/* mỗi ngày một bài: hôm nay đã tick xong một ngày học thì ngày kế tiếp chờ tới hôm sau */
const doneToday=()=>{const t=localDay(Date.now());return Object.values(STATE.days).some(r=>r&&r.done&&r.at&&localDay(r.at)===t)};
function seqOpen(n,i){
  const g=seqOf(n,i);
  for(const w of WEEKS)for(let k=1;k<=w.days.length;k++)if(seqOf(w.n,k)<g&&!isDone(w.n,k))return false;
  return true;
}
function isOpen(n,i){
  if(!CTX.canWrite||isDone(n,i))return true;
  if(!seqOpen(n,i))return false;
  return !(CFG.daily&&doneToday());
}
/* lý do một ngày còn khoá, dùng cho dòng trên tiêu đề và thông báo khi bấm */
function lockText(n,i){
  if(seqOpen(n,i))return "Mở vào ngày mai · mỗi ngày học 1 bài";
  const p=prevOf(n,i);
  return `Chưa mở · cần học xong ${p.n!==n?"Tuần "+p.n+" · ":""}Ngày ${p.i} trước`;
}
function prevOf(n,i){
  if(i>1)return {n,i:i-1};
  const w=WEEKS[WEEKS.findIndex(x=>x.n===n)-1];
  return {n:w.n,i:w.days.length};
}
/* hạn của một ngày: hết 24 giờ của ngày đó theo lịch (mỗi tuần DPW() ngày liên tiếp, tính từ ngày bắt đầu) */
function dueOf(n,i){
  const s=STATE.config&&STATE.config.start;
  if(!s)return null;
  const t=new Date(s+"T00:00:00");
  if(isNaN(t))return null;
  t.setDate(t.getDate()+seqOf(n,i)+1);
  return t;
}
const isLate=(n,i)=>{const r=STATE.days[dayId(n,i)];return !!(r&&r.done&&r.late)};
function setDone(n,i,v,flags){
  const now=new Date(),due=dueOf(n,i);
  const rec={w:n,d:i,done:v,at:now.toISOString()};
  if(v&&due&&now>=due){rec.late=true;rec.due=due.toISOString()}
  if(flags&&flags.length)rec.flags=flags;
  STATE.days[dayId(n,i)]=rec;
  const id=dayId(n,i);
  if(CTX.online)dbSet("days/"+id,rec);else{LS.set(CFG.store+":d:"+id,v?"1":"0");LS.set(CFG.store+":dl:"+id,rec.late?"1":"0");LS.set(CFG.store+":da:"+id,rec.at);LS.set(CFG.store+":df:"+id,JSON.stringify(rec.flags||[]))}
}
/* ghi chú điểm thấp / bỏ trống: lấy kết quả lần bấm Kiểm tra ĐẦU TIÊN của từng bài trong ngày */
function dayFlags(det){
  const out=[];
  $$(".block.ex",det).forEach(sec=>{
    const r=CHK.res(sec.id);if(!r||!r.total)return;
    if(r.blank>0||r.ok/r.total<CFG.low){const h=$("h3",sec);out.push({h:(h?h.textContent:"Bài tập").slice(0,60),ok:r.ok,total:r.total,blank:r.blank||0})}
  });
  return out;
}
const flagKind=f=>[f.ok/f.total<CFG.low?"điểm thấp":"",f.blank?"bỏ trống":""].filter(Boolean).join(", ");
const flagText=f=>`${f.h}: ${f.ok}/${f.total} câu đúng${f.blank?`, bỏ trống ${f.blank} câu`:""}`;
function addAttempt(a){
  STATE.attempts.push(a);
  if(CTX.online)dbSet("attempts/"+a.id,a);else LS.set(CFG.store+":attempts",JSON.stringify(STATE.attempts));
}
function setSpeak(id,rec){
  STATE.speaking[id]=rec;
  if(CTX.online)dbSet("speaking/"+id,rec);else LS.set(CFG.store+":speak",JSON.stringify(STATE.speaking));
}
/* ---------- lượt làm bài: mỗi lần bấm Kiểm tra = 1 lượt, có giờ bắt đầu, kết thúc và từng câu trả lời ---------- */
function addRun(r){
  STATE.runs[r.id]=r;
  if(CTX.online)dbSet("runs/"+r.id,r);else LS.set(CFG.store+":runs",JSON.stringify(STATE.runs));
}
/* bắt đầu lượt = lần đầu chạm vào bài (gõ/chọn) kể từ lần Kiểm tra hoặc Làm lại trước đó */
function markRunStart(sec){if(sec&&!sec.dataset.r0)sec.dataset.r0=String(Date.now())}
function recordRun(sec,ans,correct,total,attemptId){
  if(!CTX.canWrite)return;
  const end=Date.now(),start=sec.dataset.r0?+sec.dataset.r0:end;
  delete sec.dataset.r0;
  const m=/^w(\d+)d(\d+)b(\d+)$/.exec(sec.id)||[];
  const w=+m[1]||0,d=+m[2]||0;
  const due=w?dueOf(w,d):null;
  const r={id:sec.id+"_"+end,ex:sec.id,w,d,h:($("h3",sec)||{}).textContent||"",kind:sec.dataset.kind,
    start:new Date(start).toISOString(),end:new Date(end).toISOString(),secs:Math.round((end-start)/1000),
    correct,total,ans:ans.map(a=>[String(a[0]).slice(0,60),a[1]?1:0])};
  if(sec.dataset.test)r.test=sec.dataset.test;
  if(attemptId)r.attempt=attemptId;
  if(due&&end>=due)r.late=true;
  addRun(r);
}
const blockOf=ex=>{const m=/^w(\d+)d(\d+)b(\d+)$/.exec(ex);if(!m)return null;const w=WEEKS.find(x=>x.n===+m[1]);const d=w&&w.days[+m[2]-1];return d?d.blocks[+m[3]-1]:null};
const fmtTime=iso=>{try{return new Date(iso).toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})}catch(e){return ""}};
const fmtDur=s=>s<60?s+" giây":Math.floor(s/60)+" phút "+(s%60?String(s%60).padStart(2,"0")+" giây":"");
const plainQ=s=>String(s).replace(/\[\[say:(.+?)\]\]/g,"(nghe)");
/* các lượt của một bài, cũ trước mới sau; bài kiểm tra cũ (trước khi có ghi lượt) lấy từ attempts */
function runsOf(ex){
  const list=Object.values(STATE.runs).filter(r=>r&&r.ex===ex);
  const b=blockOf(ex);
  if(b&&b.test){
    const linked=new Set(list.map(r=>r.attempt).filter(Boolean));
    STATE.attempts.filter(a=>a.test===b.test&&!linked.has(a.id)).forEach(a=>{
      const end=new Date(a.at).getTime();
      list.push({id:"old_"+a.id,ex,old:true,start:new Date(end-(a.seconds||0)*1000).toISOString(),end:a.at,secs:a.seconds||0,correct:a.correct,total:a.total,late:a.late,h:b.h});
    });
  }
  return list.sort((p,q)=>p.end<q.end?-1:1);
}
const OPEN_RUNS=new Set();
function runDetail(r){
  if(r.old||!r.ans)return `<p class="line muted">Lượt này làm trước khi ebook ghi từng câu, chỉ có điểm và thời gian.</p>`;
  const b=blockOf(r.ex);
  const rows=r.ans.map((a,i)=>{
    const it=b&&b.items[i];
    const q=it?esc(plainQ(it[0])):"Câu "+(i+1);
    const key=it?esc(String(it[1]).split("|").join(" / ")):"";
    const given=a[0]===""?'<span class="muted">(bỏ trống)</span>':esc(a[0]);
    return `<tr><td>${i+1}</td><td>${q}</td><td>${given}</td><td class="${a[1]?"ok":"bad"}">${a[1]?"Đúng":"Sai"}</td><td>${a[1]?"":key}</td></tr>`;
  }).join("");
  return `<div class="tablewrap"><table><tr><th>#</th><th>Câu</th><th>${esc(CFG.student)} trả lời</th><th></th><th>Đáp án đúng</th></tr>${rows}</table></div>`;
}
function runRow(r,n,showEx){
  const pct=r.total?Math.round(r.correct/r.total*100):0;
  const sameDay=new Date(r.start).toDateString()===new Date(r.end).toDateString();
  const time=`${fmtDate(r.start)} → ${sameDay?fmtTime(r.end):fmtDate(r.end)}`;
  const fast=r.total&&r.secs>0&&r.secs<r.total*4;
  return `<details class="run" data-run="${esc(r.id)}"${OPEN_RUNS.has(r.id)?" open":""}><summary><span class="rn">Lượt ${n}</span>${showEx?`<span class="rx">${esc(r.h||"")}</span>`:""}<span class="rt">${time} · ${r.secs?fmtDur(r.secs):"dưới 1 giây"}</span><span class="${pct>=80?"tag-pass":"tag-fail"}">${r.correct}/${r.total} (${pct}%)</span>${r.late?'<span class="latetag">Muộn</span>':""}${fast?'<span class="tag-fail">làm rất nhanh</span>':""}</summary><div class="rd">${runDetail(r)}</div></details>`;
}
function runsHTML(ex){
  const list=runsOf(ex);
  if(!list.length)return "";
  return `<b>Các lượt ${esc(CFG.student)} đã làm (${list.length})</b>`+list.map((r,i)=>runRow(r,i+1)).reverse().join("");
}
function scoreOf(t){
  const a=STATE.attempts.filter(x=>x.test===t).sort((p,q)=>p.at<q.at?-1:1);
  if(!a.length)return null;
  const best=Math.max(...a.map(x=>x.correct));
  return {first:a[0].correct,best,last:a[a.length-1].correct,total:a[a.length-1].total,n:a.length};
}

/* bài tập đã bấm Kiểm tra (lưu trên máy) — cần làm hết mới tick được "Đã học xong" */
const CHK={
  get(id){return LS.get(CFG.store+":chk:"+id)==="1"},
  set(id,r){LS.set(CFG.store+":chk:"+id,"1");if(r&&LS.get(CFG.store+":chkr:"+id)==null)LS.set(CFG.store+":chkr:"+id,JSON.stringify(r))},
  res(id){try{return JSON.parse(LS.get(CFG.store+":chkr:"+id)||"null")}catch(e){return null}}

function dayLeft(det){

/* ---------- block renderers ---------- */

  <div class="actions"><button class="btn" data-act="check-mcq">Kiểm tra</button><button class="btn ghost" data-act="reset-mcq">Làm lại</button><span class="score" aria-live="polite">${sc?`Lần đầu: ${sc.first}/${sc.total} · Cao nhất: ${sc.best}/${sc.total}`:""}</span></div><div class="runs"></div></section>`;

function rSpeak(b,id){

  <div class="takes"></div><p class="rec-note">Bấm Dừng là bài ghi âm tự lưu vào Drive của thầy/cô. Nếu trình duyệt không cho ghi âm, hãy ghi bằng điện thoại rồi gửi qua Zalo.</p></div>`;

function rBlock(b,id){
  return b.t==="note"?rNote(b):b.t==="vocab"?rVocab(b,id):b.t==="fill"?rFill(b,id):b.t==="mcq"?rMcq(b,id):rSpeak(b,id);
}

/* ---------- pages ---------- */
function weekTests(w){const t=[];w.days.forEach(d=>d.blocks.forEach(b=>{if(b.t==="mcq"&&b.test&&!t.includes(b.test))t.push(b.test)}));return t}
const DPW=()=>WEEKS[0].days.length; /* số ngày mỗi tuần (mọi tuần cùng số ngày) */
function speakIds(w){
  const ids=[];
  w.days.forEach((d,di)=>d.blocks.forEach((b,bi)=>{if(b.t==="speak")ids.push(`w${w.n}d${di+1}b${bi+1}`)}));
  return ids;
}
function weekProgress(w){
  let done=0;w.days.forEach((d,i)=>{if(isDone(w.n,i+1))done++});
  return Math.round(done/w.days.length*100);
}

function renderWeek(w){
  let opened=false;
  const days=w.days.map((d,di)=>{
    const blocks=d.blocks.map((b,bi)=>rBlock(b,`w${w.n}d${di+1}b${bi+1}`)).join("");
    const done=isDone(w.n,di+1);
    const isTest=d.blocks.some(b=>b.t==="mcq"&&b.test);
    if(!isOpen(w.n,di+1)){
      const p=prevOf(w.n,di+1);
      return `<details class="day locked" data-wd="${w.n}-${di+1}">
      <summary><span class="dn">Ngày ${di+1}</span><span class="dt">${esc(d.title)}</span><span class="dm">${d.min} phút</span><span class="lk">${lockText(w.n,di+1)}</span></summary></details>`;
    }
    const open=(!done&&!opened)?(opened=true," open"):"";
    const due=dueOf(w.n,di+1);
    const rec=STATE.days[dayId(w.n,di+1)];
    const fl=done&&rec&&rec.flags&&rec.flags.length?rec.flags:null;
    const late=(isLate(w.n,di+1)?`<span class="latetag">Hoàn thành muộn</span>`:"")+(fl?`<span class="latetag">Điểm thấp / bỏ trống</span>`:"");
    const flagNote=fl?`<p class="warnline">Khi tick xong, ngày này có bài làm chưa tốt (đã ghi vào Sổ điểm): ${fl.map(f=>esc(flagText(f))).join("; ")}.</p>`:"";
    const dueTxt=!done&&due?`<p class="donehint">Hạn: hết ngày ${new Date(due-1).toLocaleDateString("vi-VN")}. Làm sau hạn vẫn được lưu điểm nhưng sẽ ghi "Hoàn thành muộn".</p>`:"";
    return `<details class="day${done?" done":""}" data-wd="${w.n}-${di+1}"${open}>
    <summary><span class="dn">Ngày ${di+1}</span><span class="dt">${esc(d.title)}</span><span class="dm">${d.min} phút</span><span class="ok">Đã xong</span>${late}</summary>
    <div class="daybody">${blocks}<label class="donebar"><input type="checkbox" data-act="day-done" data-w="${w.n}" data-d="${di+1}"${done?" checked":""}> ${isTest?"Đã làm xong bài kiểm tra":"Đã học xong ngày này"}</label><p class="donehint" data-left></p>${flagNote}${dueTxt}</div></details>`;
  }).join("");
  const goals=w.goals.map(g=>`<li>${esc(g)}</li>`).join("");
  return `<div class="hero"><div class="eyebrow">Tuần ${w.n} · ${esc(w.sub)}</div><h1>${esc(w.title)}</h1>
  <p class="lede">${w.why}</p><ul class="goals">${goals}</ul>
  <div class="chips"><span class="chip">${w.days.length} ngày</span><span class="chip s">${speakIds(w).length} bài nói</span><span class="chip w">Kiểm tra cuối tuần: cần ${PCT}%</span></div></div>${days}`;
}

/* ----- observer dashboard ----- */
function weekSummary(w){
  const total=w.days.length;
  let done=0;w.days.forEach((d,i)=>{if(isDone(w.n,i+1))done++});
  const tests=weekTests(w).map(t=>({id:t,s:scoreOf(t)}));
  const sids=speakIds(w);
  const sent=sids.filter(id=>STATE.speaking[id]&&STATE.speaking[id].sent).length;
  const needSent=Math.ceil(sids.length*CFG.speakRatio);
  const attempts=STATE.attempts.filter(a=>weekTests(w).includes(a.test));
  const fast=attempts.some(a=>a.seconds>0&&a.seconds<a.total*12);
  const touched=[];
  w.days.forEach((d,i)=>{const r=STATE.days[dayId(w.n,i+1)];if(r&&r.at)touched.push(r.at)});
  attempts.forEach(a=>touched.push(a.at));
  sids.forEach(id=>{const r=STATE.speaking[id];if(r&&r.at)touched.push(r.at)});
  touched.sort();
  const started=done>0||attempts.length>0||sent>0;
  const reasons=[];
  if(done<total-CFG.allowMiss)reasons.push(`Mới học ${done}/${total} ngày, cần ít nhất ${total-CFG.allowMiss}`);
  tests.forEach(t=>{
    if(!t.s)reasons.push(`Chưa làm ${testName(t.id).toLowerCase()}`);
    else if(t.s.first/t.s.total<PASS)reasons.push(`${testName(t.id,true)}: lần đầu ${Math.round(t.s.first/t.s.total*100)}%, chưa đạt ${PCT}%`);
  });
  if(sent<needSent)reasons.push(`Bài nói đã gửi ${sent}/${sids.length}, cần ít nhất ${needSent}`);
  const testTaken=tests.some(t=>t.s);
  let status;
  if(!started)status="none";
  else if(!reasons.length)status="pass";
  else if(testTaken||done===total)status="fail";
  else status="going";
  // schedule
  let late=false,future=false;
  const cw=currentWeek();
  if(cw!=null){
    if(w.n>cw&&!started)future=true;
    if(w.n<cw&&status!=="pass")late=true;
  }
  return {total,done,tests,sids,sent,needSent,attempts,fast,last:touched.length?touched[touched.length-1]:null,started,reasons,status,late,future};
}
/* lịch: mỗi tuần là DPW() ngày liên tiếp tính từ ngày bắt đầu, không theo thứ trong tuần */
function schedPos(){
  const s=STATE.config&&STATE.config.start;
  if(!s)return null;
  const t=new Date(s+"T00:00:00");
  if(isNaN(t))return null;
  const n=new Date();
  const idx=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-t)/86400000);
  return {idx,w:Math.floor(idx/DPW())+1,d:idx%DPW()+1};
}
function currentWeek(){
  const p=schedPos();
  if(!p)return null;
  return p.idx<0?0:Math.min(WEEKS.length+1,p.w);
}
/* chọn ngày bằng 3 ô Ngày – Tháng – Năm, để mọi máy đều hiện theo thứ tự ngày/tháng/năm */
const todayISO=()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`};
function dmyHTML(id,iso){
  const [y,m,d]=(iso||todayISO()).split("-").map(Number);
  const cy=new Date().getFullYear();
  const opt=(a,b,v,f)=>{let h="";for(let i=a;i<=b;i++)h+=`<option value="${i}"${i===v?" selected":""}>${f?f(i):i}</option>`;return h};
  return `<div class="dmy" id="${id}" role="group" aria-label="Ngày, tháng, năm">
  <select aria-label="Ngày">${opt(1,31,d)}</select>
  <select aria-label="Tháng">${opt(1,12,m,i=>"Tháng "+i)}</select>
  <select aria-label="Năm">${opt(Math.min(y,cy-1),Math.max(y,cy+1),y)}</select></div>`;
}
function readDmy(id){
  const [d,m,y]=$$("#"+id+" select").map(x=>+x.value);
  const t=new Date(y,m-1,d);
  if(t.getDate()!==d||t.getMonth()!==m-1)return null;
  return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
const fmtDay=s=>{const [y,m,d]=String(s).split("-");return d&&m?`${d}/${m}/${y}`:s};
function schedHTML(){
  const p=schedPos();
  if(!p)return "";
  let t;
  if(p.idx<0)t=`Chưa tới ngày bắt đầu (${fmtDay(STATE.config.start)}).`;
  else if(p.w>WEEKS.length)t=`Đã hết ${WEEKS.length} tuần theo lịch (bắt đầu ${fmtDay(STATE.config.start)}).`;
  else t=`Hôm nay theo lịch: <a href="#w${p.w}"><b>Tuần ${p.w} · Ngày ${p.d}</b></a> (bắt đầu ${fmtDay(STATE.config.start)}).`;
  return `<p class="sched">${t}</p>`;
}
const ROLE_NAME={student:CFG.student,parent:"Phụ huynh",teacher:"Giáo viên"};

const STATUS_UI={
  pass:["Đạt tuần","tag-pass"],fail:["Chưa đạt","tag-fail"],going:["Đang học","tag-mid"],none:["Chưa bắt đầu","tag-mute"]
};
function renderTracker(){
  const sums=WEEKS.map(w=>({w,s:weekSummary(w)}));

  const finals=CFG.finals.length?CFG.finals:weekTests(WEEKS[WEEKS.length-1]);
  const mockOk=finals.length>0&&finals.every(id=>{const x=scoreOf(id);return x&&x.first/x.total>=PASS});
  const sched=cw==null?CFG.student+" chưa chọn ngày bắt đầu, nên chưa so sánh được với lịch.":cw===0?"Chưa tới ngày bắt đầu.":cw>WEEKS.length?`Đã hết ${WEEKS.length} tuần theo lịch.`:(late?"Có tuần đang chậm so với lịch.":"Chưa thấy tuần nào chậm so với lịch.");
  const cards=sums.map(({w,s})=>{

    const dots=w.days.map((d,i)=>`<i class="dot${isDone(w.n,i+1)?(isLate(w.n,i+1)?" late":" on"):""}" title="Ngày ${i+1}${isLate(w.n,i+1)?": hoàn thành muộn":""}"></i>`).join("");
    const lateDays=w.days.map((d,i)=>i+1).filter(i=>isLate(w.n,i));
    const lateLine=lateDays.length?`<p class="line"><span class="latetag">Hoàn thành muộn</span> Ngày ${lateDays.join(", ")}</p>`:"";
    const flagDays=w.days.map((d,i)=>({i:i+1,r:STATE.days[dayId(w.n,i+1)]})).filter(x=>x.r&&x.r.done&&x.r.flags&&x.r.flags.length);
    const flagLine=flagDays.length?`<div class="warnline">Học xong nhưng làm chưa tốt (lần Kiểm tra đầu dưới ${Math.round(CFG.low*100)}% hoặc bỏ trống):<ul class="why">${flagDays.map(x=>`<li>Ngày ${x.i}: ${x.r.flags.map(f=>esc(flagText(f))).join("; ")}</li>`).join("")}</ul></div>`:"";

    const reasons=(s.status==="fail"||s.status==="going"||s.late)&&s.reasons.length?`<ul class="why">${s.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`:"";
    const fast=s.fast?`<p class="warnline">Có lần làm bài kiểm tra quá nhanh (dưới 12 giây mỗi câu).</p>`:"";

      else noteHTML=`<p class="notel">Nhận xét của giáo viên</p><p class="notetext">${note&&note.text?esc(note.text):"Chưa có nhận xét."}</p>${note&&note.at?`<p class="saved">${fmtDate(note.at)}</p>`:""}`;
    }
    return `<article class="wcard"><header><h3>Tuần ${w.n} · ${esc(w.title)}</h3><span class="status ${ui[1]}">${ui[0]}</span></header>
    <div class="dots" aria-label="${s.done}/${s.total} ngày đã học">${dots}<span>${s.done}/${s.total} ngày</span></div>
    <p class="line">${tl}</p>
    ${lateLine}${flagLine}<p class="line">Bài nói đã gửi: <b>${s.sent}/${s.sids.length}</b></p>
    <p class="line muted">${s.last?"Hoạt động gần nhất: "+fmtDate(s.last):"Chưa có hoạt động"}</p>

  }).join("");
  const att=STATE.attempts.slice().sort((p,q)=>p.at<q.at?1:-1).slice(0,15).map(x=>{
    const pct=Math.round(x.correct/x.total*100);

    return `<tr><td>${fmtDate(x.at)}</td><td>${name}</td><td>${x.correct}/${x.total} (${pct}%)</td><td>${pct>=80?'<span class="tag-pass">Đạt</span>':'<span class="tag-fail">Chưa đạt</span>'}${x.late?' <span class="latetag">Hoàn thành muộn</span>':""}</td><td>${x.seconds?fmtSec(x.seconds):"—"}${fastF?' <span class="tag-fail">quá nhanh</span>':""}</td></tr>`;

  const cfg=(CTX.canEdit||!CTX.online)?(STATE.config.start||CTX.canEdit?`<div class="cfg"><span>Ngày bắt đầu học (mỗi tuần ${DPW()} ngày tính từ ngày này)</span>${dmyHTML("cfg-start",STATE.config.start)}<button class="btn sm" data-act="save-start">Lưu</button><span class="saved" id="saved-start"></span></div>`:""):`<p class="line muted">Ngày bắt đầu: ${STATE.config.start?esc(fmtDay(STATE.config.start)):"chưa chọn"}</p>`;
  const localNote=!CTX.online?`<div class="callout">Điểm và tiến độ được lưu trong trình duyệt đang dùng. Hãy luôn học trên cùng một máy và cùng một trình duyệt để không mất tiến độ.</div>`:"";
  return `<div class="hero"><div class="eyebrow">${esc(roleLabel())}</div><h1>Sổ điểm</h1>
  <p class="lede">Một tuần được tính là <b>đạt</b> khi ${CFG.student} học ít nhất ${DPW()-CFG.allowMiss} trong ${DPW()} ngày, <b>lần làm đầu tiên</b> của bài kiểm tra từ ${PCT}% trở lên, và đã gửi ít nhất ${Math.round(CFG.speakRatio*100)}% số bài nói.</p></div>
  <div id="banner">${bannerHTML()}</div>${localNote}
  <div class="sumgrid">
   <div class="stat"><b>${passed}/${WEEKS.length}</b><span>tuần đạt</span></div>
   <div class="stat"><b>${mockOk?"Có":"Chưa"}</b><span>${finals.length>1?"tất cả bài thi cuối":"bài thi cuối"} đạt ${PCT}%</span></div>
   <div class="stat"><b>${STATE.attempts.length}</b><span>lượt làm bài kiểm tra</span></div>
  </div>
  <p class="line">${esc(sched)}</p>${cfg}
  <h2 style="margin-top:22px">Theo từng tuần</h2><div class="wgrid">${cards}</div>
  ${runHistoryHTML()}
  <h2 style="margin-top:22px">15 lượt làm bài kiểm tra gần nhất</h2>
  ${att?`<div class="tablewrap"><table><tr><th>Thời điểm</th><th>Bài</th><th>Điểm</th><th>Kết quả</th><th>Thời gian làm</th></tr>${att}</table></div>`:`<p class="line muted">Chưa có lượt làm bài kiểm tra nào.</p>`}`;
}

/* Sổ điểm: lịch sử mọi lượt làm bài, theo ngày làm, lọc theo tuần */
let RUN_WEEK=null;
function runHistoryHTML(){
  const sel=$("#run-week");if(sel)RUN_WEEK=sel.value;
  const all=[];
  WEEKS.forEach(w=>w.days.forEach((d,di)=>d.blocks.forEach((b,bi)=>{
    if(b.t!=="fill"&&b.t!=="mcq")return;
    const ex=`w${w.n}d${di+1}b${bi+1}`;
    runsOf(ex).forEach((r,i)=>all.push({r,n:i+1,w:w.n,d:di+1,h:b.h}));
  })));
  const weeksWith=[...new Set(all.map(x=>x.w))].sort((a,b)=>a-b);
  if(RUN_WEEK==null){const cw=currentWeek();RUN_WEEK=weeksWith.includes(cw)?String(cw):(weeksWith.length?String(weeksWith[weeksWith.length-1]):"all")}
  const shown=all.filter(x=>RUN_WEEK==="all"||String(x.w)===RUN_WEEK).sort((p,q)=>p.r.end<q.r.end?1:-1);
  const opts=`<option value="all"${RUN_WEEK==="all"?" selected":""}>Tất cả các tuần</option>`+WEEKS.map(w=>`<option value="${w.n}"${String(w.n)===RUN_WEEK?" selected":""}>Tuần ${w.n}</option>`).join("");
  let body="",lastDay="";
  shown.forEach(x=>{
    const day=new Date(x.r.end).toLocaleDateString("vi-VN",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"});
    if(day!==lastDay){body+=`<p class="rday">${esc(day)}</p>`;lastDay=day}
    body+=runRow({...x.r,h:`Tuần ${x.w} · Ngày ${x.d} · ${x.h}`},x.n,true);
  });
  const totalSecs=shown.reduce((t,x)=>t+(x.r.secs||0),0);
  return `<h2 style="margin-top:22px">Lịch sử làm bài</h2>
  <p class="line muted">Mỗi lần ${esc(CFG.student)} bấm "Kiểm tra" là một lượt. Giờ bắt đầu là lúc ${esc(CFG.student)} bắt đầu gõ hoặc chọn đáp án, giờ kết thúc là lúc bấm Kiểm tra. Bấm vào một lượt để xem ${esc(CFG.student)} trả lời từng câu thế nào. Bài luyện làm trước ngày 18/11/2026 chưa được ghi lại.</p>
  <div class="runfilter"><label for="run-week">Xem</label><select id="run-week">${opts}</select><span class="muted">${shown.length} lượt${totalSecs?" · tổng "+fmtDur(totalSecs):""}</span></div>
  ${body||`<p class="line muted">Chưa có lượt làm bài nào trong phần này.</p>`}`;
}

/* keep checkboxes / buttons in sync with state without re-rendering the page */

/* ---------- recorder (local file only) ---------- */
let activeRec=null;
function stopActive(){if(activeRec&&activeRec.mr.state!=="inactive")activeRec.mr.stop()}
async function toggleRec(btn){
  const wrap=btn.closest(".rec-wrap");
  if(activeRec&&activeRec.wrap===wrap){stopActive();return}
  if(activeRec)stopActive();
  const note=$(".rec-note",wrap);
  if(!navigator.mediaDevices||!window.MediaRecorder){note.textContent="Trình duyệt này không hỗ trợ ghi âm. Hãy ghi bằng ứng dụng ghi âm trên điện thoại hoặc voice note Zalo rồi gửi lại.";return}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){note.textContent="Không dùng được micro. Hãy cho phép micro trong trình duyệt, hoặc ghi bằng điện thoại rồi gửi lại.";return}
  const mr=new MediaRecorder(stream);
  const chunks=[];const start=Date.now();
  const timer=$(".timer",wrap);
  const tick=setInterval(()=>{const s=Math.floor((Date.now()-start)/1000);timer.textContent=fmtSec(s)},250);
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{
    clearInterval(tick);stream.getTracks().forEach(t=>t.stop());
    btn.textContent="Bắt đầu ghi âm";btn.classList.remove("on");
    const type=mr.mimeType||"audio/webm";
    const ext=type.includes("mp4")?"m4a":type.includes("ogg")?"ogg":"webm";
    const blob=new Blob(chunks,{type});
    const url=URL.createObjectURL(blob);
    const takes=$(".takes",wrap);
    const n=takes.children.length+1;
    const now=new Date(),pad=x=>String(x).padStart(2,"0");
    const stamp=`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
    const name=`${CFG.file}-${wrap.dataset.rec}-lan${n}-${stamp}.${ext}`;
    const div=document.createElement("div");div.className="take";
    div.innerHTML=`<span><b>Lần ${n}</b></span><audio controls src="${url}"></audio><a class="btn ghost sm" href="${url}" download="${name}">Tải về</a><button class="btn ghost sm" data-act="del-take">Xóa</button><span class="upl"></span>`;
    takes.appendChild(div);
    div._up={blob,name,secs:Math.round((Date.now()-start)/1000)};
    activeRec=null;
    uploadTake(div);
  };
  mr.start();
  activeRec={mr,wrap};
  btn.textContent="Dừng ghi âm";btn.classList.add("on");
}

/* tải bài ghi âm lên thư mục Drive (qua Apps Script), xong thì tự đánh dấu bài nói đã gửi */
function b64(blob){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=no;r.readAsDataURL(blob)})}
async function uploadTake(div){
  const st=$(".upl",div),u=div._up;
  if(!CTX.online||!CTX.canWrite){st.textContent=CTX.online?"Chế độ xem: không lưu lên Drive.":"Bấm Tải về để lưu và gửi cho thầy/cô.";return}
  if(u.blob.size>15e6){st.innerHTML=`<span class="tag-fail">Bài quá dài để tự lưu.</span> Bấm Tải về rồi gửi qua Zalo.`;return}
  st.textContent="Đang lưu lên Drive…";
  let r=null,why="";
  try{r=await api({action:"upload",code:CTX.code,name:u.name,mime:u.blob.type||"audio/webm",data:await b64(u.blob)})}
  catch(e){why=navigator.onLine===false?"Máy đang mất mạng.":"Máy chủ Google không trả lời đúng ("+e.message+")."}
  if(!r||!r.ok){
    if(r)why=r.error==="action"?"Script trên Google vẫn là bản cũ. Thầy/cô cần triển khai Phiên bản mới.":
      r.error==="drive"?"Google Drive báo lỗi: "+r.message:
      r.error==="code"?"Mã đăng nhập đã đổi, hãy đăng nhập lại.":
      r.error==="bad_file"?"File ghi âm không hợp lệ.":"Lỗi: "+r.error;
    st.innerHTML=`<span class="tag-fail">Chưa lưu được lên Drive.</span> <button class="btn ghost sm" data-act="retry-up">Thử lại</button><br><small>${esc(why)} Có thể bấm Tải về rồi gửi qua Zalo.</small>`;
    return;
  }
  st.innerHTML=`<span class="tag-pass">Đã lưu lên Drive</span>`;
  const sec=div.closest(".block.speak");
  const id=sec.id;const m=/^w(\d+)d(\d+)b/.exec(id)||[];
  const checks=$$(".checks input:checked",sec).length,total=$$(".checks input",sec).length;
  const prev=STATE.speaking[id]||{};
  const files=(prev.files||[]).concat([{name:u.name,url:r.url,secs:u.secs}]).slice(-5);
  setSpeak(id,{w:+m[1]||0,d:+m[2]||0,title:$(".sent",sec).dataset.title,sent:true,at:new Date().toISOString(),checks,total,files});
  syncUI();renderNav(curPage());
}

/* ---------- checking ---------- */
function checkFill(sec){
  let ok=0;const inputs=$$("input.gap",sec);const given=[];
  inputs.forEach(inp=>{
    const answers=inp.dataset.a.split("|").map(norm);
    const good=answers.includes(norm(inp.value));
    given.push([inp.value.trim(),good]);
    inp.classList.toggle("ok",good);inp.classList.toggle("bad",!good);
    const fb=inp.closest("li").querySelector(".fb");
    fb.className="fb "+(good?"ok":"bad");
    const ans=inp.dataset.a.split("|").join(" hoặc ");
    fb.textContent=good?"Đúng":(inp.value.trim()?"Chưa đúng. Đáp án: ":"Chưa điền. Đáp án: ")+ans;
    if(good)ok++;
  });
  recordRun(sec,given,ok,inputs.length);
  CHK.set(sec.id,{ok,total:inputs.length,blank:inputs.filter(i=>!i.value.trim()).length});syncUI();
  const sc=$(".score",sec);sc.textContent=`${ok}/${inputs.length} câu đúng`;
  sc.className="score "+(ok/inputs.length>=0.8?"pass":"fail");
}
function resetFill(sec){
  $$("input.gap",sec).forEach(inp=>{inp.value="";inp.classList.remove("ok","bad");const fb=inp.closest("li").querySelector(".fb");fb.textContent="";fb.className="fb"});
  const sc=$(".score",sec);sc.textContent="";sc.className="score";
  delete sec.dataset.r0;
}
function checkMcq(sec){
  const qs=$$(".q",sec);let ok=0;const ans=[];
  if(sec.dataset.test&&sec.dataset.recorded!=="1"){
    const left=qs.filter(q=>!$("input:checked",q)).length;
    if(left&&!confirm(`Còn ${left} câu chưa làm, vẫn nộp?`))return;
  }
  qs.forEach(q=>{
    const correct=q.dataset.correct;
    const sel=$("input:checked",q);
    $$(".opt",q).forEach(o=>{o.classList.remove("right","wrong")});
    $$(".opt",q).forEach(o=>{
      const v=$("input",o).value;
      if(v===correct)o.classList.add("right");
      else if(sel&&v===sel.value)o.classList.add("wrong");
    });
    const fb=$(".fb",q);
    ans.push([sel?sel.value:"",!!(sel&&sel.value===correct)]);
    if(sel&&sel.value===correct){ok++;fb.textContent="";}
    else{fb.className="fb bad";fb.textContent=sel?"Đáp án đúng: "+correct:"Bạn chưa chọn. Đáp án đúng: "+correct}
  });
  const t=sec.dataset.test;
  let attemptId=null;
  if(t&&sec.dataset.recorded!=="1"&&CTX.canWrite){
    sec.dataset.recorded="1";
    const secs=sec.dataset.t0?Math.round((Date.now()-(+sec.dataset.t0))/1000):0;
    const at=new Date().toISOString();
    const m=/^w(\d+)d(\d+)b/.exec(sec.id)||[];const due=m[1]?dueOf(+m[1],+m[2]):null;
    attemptId=t+"_"+Date.now();
    addAttempt({id:attemptId,test:t,correct:ok,total:qs.length,seconds:secs,at,...(due&&new Date(at)>=due?{late:true}:{})});
  }
  recordRun(sec,ans,ok,qs.length,attemptId);
  CHK.set(sec.id,{ok,total:qs.length,blank:qs.filter(q=>!$("input:checked",q)).length});syncUI();
  if(attemptId)renderNav(curPage());
  const sc=$(".score",sec);
  const pct=Math.round(ok/qs.length*100);
  sc.textContent=`${ok}/${qs.length} câu đúng (${pct}%) · ${pct>=PCT?"Đạt":`Chưa đạt ${PCT}%`}`;
  sc.className="score "+(pct>=PCT?"pass":"fail");
}
function resetMcq(sec){
  $$(".q",sec).forEach(q=>{$$("input",q).forEach(i=>i.checked=false);$$(".opt",q).forEach(o=>o.classList.remove("right","wrong"));const fb=$(".fb",q);fb.textContent="";fb.className="fb"});
  const sc=$(".score",sec);sc.textContent="";sc.className="score";
  delete sec.dataset.t0;delete sec.dataset.recorded;delete sec.dataset.r0;
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");
  if(!el)return;
  const act=el.dataset.act;
  const sec=el.closest(".block");
  if(act==="say")say(el.dataset.say);
  else if(act==="check-fill")checkFill(sec);
  else if(act==="reset-fill")resetFill(sec);
  else if(act==="check-mcq")checkMcq(sec);
  else if(act==="reset-mcq")resetMcq(sec);
  else if(act==="rec")toggleRec(el);
  else if(act==="retry-up")uploadTake(el.closest(".take"));
  else if(act==="del-take"){const t=el.closest(".take");const a=$("audio",t);if(a&&a.src)URL.revokeObjectURL(a.src);t.remove()}
  else if(act==="sent"){
    if(!CTX.canWrite)return;
    const id=sec.id;const m=/^w(\d+)d(\d+)b/.exec(id)||[];
    const cur=STATE.speaking[id];
    const sent=!(cur&&cur.sent);
    const checks=$$(".checks input:checked",sec).length,total=$$(".checks input",sec).length;
    setSpeak(id,{w:+m[1]||0,d:+m[2]||0,title:el.dataset.title,sent,at:new Date().toISOString(),checks,total});
    syncUI();renderNav(curPage());
  }
  else if(act==="save-note"){
    const n=+el.dataset.w;const ta=$("#note-"+n);
    const rec={w:n,text:ta.value.trim(),at:new Date().toISOString()};
    STATE.notes["w"+n]=rec;
    const ok=await dbSet("notes/w"+n,rec);
    const s=$("#saved-"+n);if(s)s.textContent=ok?"Đã lưu "+fmtDate(rec.at):"Chưa gửi được, trang sẽ tự gửi lại khi có mạng.";
  }
  else if(act==="save-start"){
    const v=readDmy("cfg-start");
    if(!v){$("#saved-start").textContent="Ngày không hợp lệ, hãy chọn lại.";return}
    const ok=await saveStart(v);
    const s=$("#saved-start");if(s)s.textContent=ok?"Đã lưu":"Chưa gửi được, trang sẽ tự gửi lại khi có mạng.";
    renderPage("tracker");
  }
  else if(act==="logout"){
    const n=Q.get().length;
    if(n&&CTX.canWrite&&!confirm(`Còn ${n} kết quả chưa gửi lên sổ điểm chung. Đăng xuất bây giờ sẽ mất các kết quả này. Vẫn đăng xuất?`))return;
    logout("");
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.act==="hide-vi")el.closest(".vocab").classList.toggle("hide-vi",el.checked);
  if(el.dataset.act==="day-done"){
    if(!CTX.canWrite){el.checked=!el.checked;return}
    if(!el.checked){el.checked=true;return}
    const det=el.closest("details.day");
    if(dayLeft(det)){el.checked=false;syncUI();return}
    const flags=dayFlags(det);
    const warn=flags.length?`\n\nLưu ý: các bài sau làm chưa tốt ở lần Kiểm tra đầu và sẽ được ghi vào Sổ điểm cho giáo viên và phụ huynh xem:\n- ${flags.map(f=>flagText(f)+" ("+flagKind(f)+")").join("\n- ")}`:"";
    if(!confirm(`Xác nhận đã học xong ngày này? Sau khi tick sẽ không bỏ tick được, và ngày tiếp theo sẽ mở ${CFG.daily?"vào ngày mai":"ngay"}.${warn}`))
      {el.checked=false;return}
    const n=+el.dataset.w,i=+el.dataset.d;
    setDone(n,i,true,flags);
    if(isLate(n,i))toast("Đã lưu. Ngày này được ghi là Hoàn thành muộn vì đã quá hạn.");
    openNext(n,i);
  }
  if(el.type==="radio"){
    const sec=el.closest("[data-kind=mcq]");
    if(sec&&!sec.dataset.t0)sec.dataset.t0=String(Date.now());
    markRunStart(sec);
  }
  if(el.id==="run-week")renderPage("tracker");
});
document.addEventListener("input",e=>{if(e.target.matches("input.gap"))markRunStart(e.target.closest(".block.ex"))});
/* giữ trạng thái mở/đóng của từng lượt khi trang tự làm mới */
document.addEventListener("toggle",e=>{
  const d=e.target;if(!d.matches||!d.matches("details.run"))return;
  if(d.open)OPEN_RUNS.add(d.dataset.run);else OPEN_RUNS.delete(d.dataset.run);
},true);
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.matches("input.gap")){
    const all=$$("input.gap",e.target.closest(".block"));const i=all.indexOf(e.target);
    if(i>=0&&i<all.length-1)all[i+1].focus();else checkFill(e.target.closest(".block"));
  }
});
window.addEventListener("hashchange",()=>renderPage(curPage()));
/* sau khi tick xong: vẽ lại để mở ngày kế tiếp và cuộn tới đó */
function openNext(n,i){
  const w=WEEKS.find(x=>x.n===n);
  const nx=i<w.days.length?{n,i:i+1}:(WEEKS.find(x=>x.n===n+1)?{n:n+1,i:1}:null);
  if(!nx){renderPage(curPage());toast(`Chúc mừng ${CFG.student} đã học xong cả ${WEEKS.length} tuần!`);return}
  if(CFG.daily){renderPage(curPage());toast(`Đã lưu. Hôm nay học xong rồi, ${nx.n!==n?"Tuần "+nx.n+" · ":""}Ngày ${nx.i} sẽ mở vào ngày mai.`);return}
  if(nx.n!==n){renderPage(curPage());toast(`Đã mở Tuần ${nx.n}. Bấm Tuần ${nx.n} ở thanh bên để học tiếp.`);return}
  renderPage(curPage());
  const det=$(`details.day[data-wd="${nx.n}-${nx.i}"]`);
  if(det){det.open=true;det.scrollIntoView({behavior:"smooth",block:"start"})}
}
document.addEventListener("click",e=>{
  const sm=e.target.closest("details.day.locked>summary");
  if(sm){e.preventDefault();const [n,i]=sm.parentElement.dataset.wd.split("-").map(Number);toast(seqOpen(n,i)?"Hôm nay đã học xong 1 bài. Ngày này sẽ mở vào ngày mai.":"Ngày này chưa mở. Hãy làm hết bài của ngày trước rồi tick Đã học xong.")}
},true);
/* trang để mở qua nửa đêm: vẽ lại để mở bài của ngày mới */
let lastDayKey=localDay(Date.now());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&localDay(Date.now())!==lastDayKey){lastDayKey=localDay(Date.now());renderPage(curPage())}});

/* ---------- start date (học viên chọn ở lần mở đầu tiên) ---------- */
async function saveStart(v){
  STATE.config={...STATE.config,start:v};
  if(CTX.online)return dbSet("config/main",STATE.config);
  LS.set(CFG.store+":config",JSON.stringify(STATE.config));return true;
}
function maybeAskStart(){
  if(!CTX.canWrite||CTX.canEdit||STATE.config.start||$("#startdlg"))return;
  if(CTX.online&&CTX.status!=="ok")return;
  const d=document.createElement("div");
  d.className="gate";d.id="startdlg";
  d.innerHTML=`<form class="gate-card"><div class="eyebrow">Chào ${esc(CFG.student)}</div><h2>Chọn ngày bắt đầu học</h2>
  <p>Ngày học tiếp theo tự tính từ ngày này. Cứ ${DPW()} ngày liên tiếp là xong 1 tuần, không phụ thuộc thứ trong tuần.</p>
  <b>Ngày bắt đầu</b>${dmyHTML("start-date")}<p class="dmy-err" id="start-err" role="alert"></p>
  <button class="btn" type="submit">Bắt đầu học</button></form>`;
  document.body.appendChild(d);
  d.querySelector("form").addEventListener("submit",async ev=>{
    ev.preventDefault();
    const v=readDmy("start-date");
    if(!v){$("#start-err").textContent="Ngày không hợp lệ, hãy chọn lại.";return}
    d.remove();
    renderPage(curPage());
    await saveStart(v);
    onData();
  });
}

/* ---------- login with a code (shared mode) ---------- */
function setRole(role){
  CTX.role=role;CTX.online=true;
  CTX.canWrite=role==="student";CTX.canEdit=role==="teacher";
}
async function refresh(){
  try{
    const r=await api({action:"load",code:CTX.code});
    if(!r.ok){if(r.error==="code"){logout("Mã đăng nhập đã thay đổi. Hãy nhập mã mới.");return}throw new Error(r.error)}
    if(r.role!==CTX.role){setRole(r.role);LS.set(CFG.store+":role",r.role)}
    const d=r.data||{};
    STATE.days=d.days||{};STATE.attempts=Object.values(d.attempts||{});STATE.speaking=d.speaking||{};
    STATE.notes=d.notes||{};STATE.config=(d.config&&d.config.main)||{};STATE.runs=d.runs||{};
    if(CTX.canWrite){migrateLocal();Q.get().forEach(applyItem)}
    saveCache();
    CTX.status="ok";
    if(CTX.canWrite&&Q.get().length)flush();
  }catch(e){
    CTX.status="offline";
  }
  onData();
  maybeAskStart();
}
/* progress saved on this device before logging in is sent to the sheet once */
function migrateLocal(){
  if(LS.get(CFG.store+":migrated")==="1")return;
  const q=Q.get();
  WEEKS.forEach(w=>w.days.forEach((d,i)=>{
    const id=dayId(w.n,i+1);
    if(LS.get(CFG.store+":d:"+id)==="1"&&!STATE.days[id])q.push({path:"days/"+id,data:{w:w.n,d:i+1,done:true,at:new Date().toISOString()}});
  }));
  try{JSON.parse(LS.get(CFG.store+":attempts")||"[]").forEach(a=>{if(a&&a.id&&!STATE.attempts.some(x=>x.id===a.id))q.push({path:"attempts/"+a.id,data:a})})}catch(e){}
  try{const sp=JSON.parse(LS.get(CFG.store+":speak")||"{}");Object.keys(sp).forEach(id=>{if(!STATE.speaking[id])q.push({path:"speaking/"+id,data:sp[id]})})}catch(e){}
  try{const c=JSON.parse(LS.get(CFG.store+":config")||"{}");if(c.start&&!STATE.config.start)q.push({path:"config/main",data:c})}catch(e){}
  Q.set(q);LS.set(CFG.store+":migrated","1");
}
function logout(msg){
  [CFG.store+":code",CFG.store+":role",CFG.store+":cache"].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
  if(!msg)try{localStorage.removeItem(CFG.store+":queue")}catch(e){}
  CTX.online=false;CTX.code=null;CTX.role=null;
  STATE.days={};STATE.attempts=[];STATE.speaking={};STATE.notes={};STATE.config={};STATE.runs={};
  const sd=$("#startdlg");if(sd)sd.remove();
  showGate(msg);
}
function showGate(msg){
  $("#gate").hidden=false;$(".shell").hidden=true;
  $("#gate-msg").textContent=msg||"";
  setTimeout(()=>$("#gate-code").focus(),50);
}
$("#gate-form").addEventListener("submit",async e=>{
  e.preventDefault();
  const code=$("#gate-code").value.trim();
  const msg=$("#gate-msg"),btn=$("#gate-form button");
  if(!code){msg.textContent="Hãy nhập mã.";return}
  btn.disabled=true;msg.textContent="Đang kiểm tra…";
  let r=null;
  try{r=await api({action:"login",code})}catch(err){}
  btn.disabled=false;
  if(!r){msg.textContent="Không kết nối được. Kiểm tra mạng rồi thử lại.";return}
  if(!r.ok){msg.textContent="Mã không đúng. Kiểm tra lại hoặc hỏi giáo viên.";return}
  const prev=LS.get(CFG.store+":lastrole");
  if(r.role!=="student"||(prev&&prev!=="student"))Q.set([]);
  LS.set(CFG.store+":code",code);LS.set(CFG.store+":role",r.role);LS.set(CFG.store+":lastrole",r.role);
  $("#gate-code").value="";msg.textContent="";
  startShared(code,r.role,true);
});
function startShared(code,role,fresh){
  CTX.code=code;setRole(role);
  loadCache();if(CTX.canWrite)Q.get().forEach(applyItem);
  CTX.status="loading";
  $("#gate").hidden=true;$(".shell").hidden=false;
  if(role!=="student"&&(fresh||!location.hash))history.replaceState(null,"","#tracker");
  renderPage(curPage());
  refresh();
}
function boot(){
  if(!CTX.remote){loadLocal();renderPage(curPage());maybeAskStart();return}
  const code=LS.get(CFG.store+":code"),role=LS.get(CFG.store+":role");
  if(!code||!role){showGate("");return}
  startShared(code,role);
}
setInterval(()=>{
  if(!CTX.online||document.visibilityState!=="visible")return;
  if(CTX.canWrite){if(Q.get().length)flush()}
  else refresh();
},60000);
document.addEventListener("visibilitychange",()=>{if(CTX.online&&document.visibilityState==="visible")refresh()});
window.addEventListener("online",()=>{if(CTX.online)flush()});
boot();
</script>
